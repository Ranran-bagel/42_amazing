[build-system]

requires = ["setuptools>=68"]

build-backend = "setuptools.build_meta"

[project]

name = "mazegen"

version = "1.0.0"

description = "A reusable maze generator supporting multiple algorithms"

readme = "README.md"

requires-python = ">=3.10"

license = "MIT"

authors = [
    { name = "wezhou" },
    { name = "mmoriya" },
]

[tool.setuptools.packages.find]

include = ["mazegen*"]

exclude = ["tests*"]
